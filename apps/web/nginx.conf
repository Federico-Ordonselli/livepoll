# Serves the SPA and proxies /api + /socket.io to the API on the same origin,
# so cookies are first-party and the browser never needs CORS.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  # Resolve "api" through Docker's DNS at request time (not once at startup), so
  # a recreated api container with a new IP is picked up without restarting nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3333;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers are set per static location below: an add_header inside a
  # location replaces (not extends) server-level ones, and /api already sends its own.

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (not append) so clients cannot spoof their IP for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (/dashboard, /p/:slug, ...) serve index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
